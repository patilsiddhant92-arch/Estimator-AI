[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "estimator"
version = "0.1.0"
description = "HVAC/BMS controls proposals and price sheets, built on AME's own templates"
requires-python = "==3.13.*"
dependencies = [
  "pydantic==2.13.5",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "pillow==12.3.0",   # openpyxl needs it to keep the logo in the price workup
  "lxml==6.1.3",
  "pymupdf==1.28.2",  # reads the bid documents; AGPL — fine for internal use inside Nordomatic (design §13)
  "anthropic==1.8.0", # the optional AI judge (writing/judge.py); runs only when ANTHROPIC_API_KEY is set
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: growth-timing tests; deselect with -m \"not slow\" when the machine is busy"]
